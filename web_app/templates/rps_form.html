{% extends "bootstrap_layout.html" %}
{% set active_page = "rps_form" %}

{% block content %}

    <h1>Rock, Paper, Scissors</h1>

    <form action="/rps/results" method="POST">
        <label for="user_choice" class="form-label">Choose your move:</label>
        <select name="user_choice" id="user_choice" class="form-select" style="max-width: 300px;">
            <option value="rock">Rock</option>
            <option value="paper">Paper</option>
            <option value="scissors">Scissors</option>
        </select>
        <br>
        <button type="submit" class="btn btn-primary">Play</button>
    </form>

{% endblock %}
